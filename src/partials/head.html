<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
{{robots}}
<meta name="theme-color" content="#063063">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://aldy-lab.github.io/bravo/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<script>try{if(localStorage.getItem('bravo-mode')==='drawing')document.documentElement.dataset.mode='drawing';var q=new URLSearchParams(location.search).get('preview');if(q!==null)sessionStorage.setItem('bravo-preview',q==='0'?'':'1');if(sessionStorage.getItem('bravo-preview'))document.documentElement.dataset.preview=''}catch(e){}</script>
<script src="js/content.js" defer></script>
<script src="js/site.js" defer></script>
</head>
<body class="{{body}}">
